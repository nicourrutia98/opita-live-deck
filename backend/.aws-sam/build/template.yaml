AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Unified WebSocket backend for the Real-Time Presentation App.
Resources:
  LiveDeckConnectionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: LiveDeckConnections
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
      - AttributeName: connectionId
        AttributeType: S
      KeySchema:
      - AttributeName: connectionId
        KeyType: HASH
  LiveDeckWebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: LiveDeckWebSocketApi
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: $request.body.action
  ConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Ref: LiveDeckWebSocketApi
      RouteKey: $connect
      AuthorizationType: NONE
      Target:
        Fn::Join:
        - /
        - - integrations
          - Ref: ConnectIntegration
  DisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Ref: LiveDeckWebSocketApi
      RouteKey: $disconnect
      Target:
        Fn::Join:
        - /
        - - integrations
          - Ref: DisconnectIntegration
  DefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Ref: LiveDeckWebSocketApi
      RouteKey: $default
      Target:
        Fn::Join:
        - /
        - - integrations
          - Ref: DefaultIntegration
  ConnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId:
        Ref: LiveDeckWebSocketApi
      Description: Connect Integration
      IntegrationType: AWS_PROXY
      IntegrationUri:
        Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WebSocketFunction.Arn}/invocations
  DisconnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId:
        Ref: LiveDeckWebSocketApi
      Description: Disconnect Integration
      IntegrationType: AWS_PROXY
      IntegrationUri:
        Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WebSocketFunction.Arn}/invocations
  DefaultIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId:
        Ref: LiveDeckWebSocketApi
      Description: Default Integration
      IntegrationType: AWS_PROXY
      IntegrationUri:
        Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WebSocketFunction.Arn}/invocations
  WebSocketFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: WebSocketFunction
      Handler: src/handler.handler
      Runtime: nodejs20.x
      Timeout: 30
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: LiveDeckConnectionsTable
      - Statement:
        - Effect: Allow
          Action:
          - execute-api:ManageConnections
          Resource:
          - Fn::Sub: arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${LiveDeckWebSocketApi}/*
      Environment:
        Variables:
          TABLE_NAME:
            Ref: LiveDeckConnectionsTable
    Metadata:
      SamResourceId: WebSocketFunction
  Deployment:
    Type: AWS::ApiGatewayV2::Deployment
    DependsOn:
    - ConnectRoute
    - DisconnectRoute
    - DefaultRoute
    Properties:
      ApiId:
        Ref: LiveDeckWebSocketApi
  Stage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      StageName: prod
      Description: Production Stage
      DeploymentId:
        Ref: Deployment
      ApiId:
        Ref: LiveDeckWebSocketApi
      AutoDeploy: true
  WebSocketPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName:
        Ref: WebSocketFunction
      Principal: apigateway.amazonaws.com
      SourceArn:
        Fn::Sub: arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${LiveDeckWebSocketApi}/*
Outputs:
  WebSocketURI:
    Value:
      Fn::Sub: wss://${LiveDeckWebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/prod
    Description: WebSocket URL to connect to
